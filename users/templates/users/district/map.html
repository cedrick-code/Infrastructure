{% extends "users/master.html" %}

{% block title %}
Map
{% endblock %}

{% block page_title %}
Map
{% endblock %}

{% block style %}
<style>
    .page-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:25px;
    }

    .page-header h2{
        color:#0A2E5C;
    }

    .map-filters{
        display:flex;
        gap:15px;
        margin-bottom:20px;
    }

    .map-filters select{
        width:220px;
        padding:10px;
        border:1px solid #ccc;
        border-radius:6px;
    }

    .map-container{
        background:white;
        border-radius:10px;
        overflow:hidden;
        box-shadow:0 2px 8px rgba(0,0,0,.08);
        height:600px;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    #map{
        width:100%;
        height:100%;
    }

    .map-placeholder{
        text-align:center;
        color:gray;
    }

    .map-placeholder i{
        font-size:48px;
        margin-bottom:15px;
        display:block;
        color:#ccc;
    }

    .legend{
        display:flex;
        gap:20px;
        margin-top:15px;
        font-size:13px;
        color:#333;
    }

    .legend-item{
        display:flex;
        align-items:center;
        gap:8px;
    }

    .legend-dot{
        width:12px;
        height:12px;
        border-radius:50%;
        display:inline-block;
    }

    .dot-high{
        background:#c0392b;
    }

    .dot-medium{
        background:#e2a03f;
    }

    .dot-low{
        background:#1e7e34;
    }
</style>
{% endblock %}

{% block content %}

<div class="map-filters">

    <select>
        <option>All Severities</option>
        <option>High</option>
        <option>Medium</option>
        <option>Low</option>
    </select>

    <select>
        <option>All Status</option>
        <option>Validated</option>
        <option>Ongoing Repair</option>
        <option>Closed</option>
    </select>

</div>

<div class="map-container">
    <div id="map">
        <div class="map-placeholder">
            <i class="fa-solid fa-map-location-dot"></i>
            <p>Map will display here once Google Maps API is connected.</p>
        </div>
    </div>
</div>

<div class="legend">
    <div class="legend-item">
        <span class="legend-dot dot-high"></span> High Severity
    </div>
    <div class="legend-item">
        <span class="legend-dot dot-medium"></span> Medium Severity
    </div>
    <div class="legend-item">
        <span class="legend-dot dot-low"></span> Low Severity
    </div>
</div>

{% endblock %}
