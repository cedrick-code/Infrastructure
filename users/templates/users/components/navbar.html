<style>
    .navbar {
        height: 70px;
        background: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 35px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .navbar-left h2 {
        color: #0A2E5C;
        font-size: 22px;
        font-weight: 700;
    }

    .navbar-right {
        display: flex;
        align-items: center;
        gap: 25px;
    }

    .notification-btn {
        position: relative;
        border: none;
        background: #F4F6F9;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        color: #374151;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background-color 0.2s;
    }

    .notification-btn:hover {
        background: #E5E7EB;
    }

    .notification-dot {
        position: absolute;
        top: 8px;
        right: 9px;
        width: 9px;
        height: 9px;
        background: #EF4444;
        border-radius: 50%;
        border: 2px solid white;
    }

    .profile {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        padding: 6px;
        border-radius: 10px;
        transition: background-color 0.2s;
    }

    .profile:hover {
        background: #F4F6F9;
    }

    .profile-info {
        text-align: right;
    }

    .profile-info h4 {
        font-size: 15px;
        color: #111827;
        font-weight: 600;
    }

    .profile-info small {
        color: #6B7280;
        font-size: 13px;
    }

    .profile-icon {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: #0A2E5C;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        flex-shrink: 0;
    }
</style>

<div class="navbar">

    <div class="navbar-left">
        <h2>{% block page_title %}Dashboard{% endblock %}</h2>
    </div>

    <div class="navbar-right">

        <button class="notification-btn">
            <i class="fa-regular fa-bell"></i>
            <span class="notification-dot"></span>
        </button>

        <div class="profile">

            <div class="profile-info">
                <h4>{{ request.user.get_full_name|default:request.user.username }}</h4>
                <small>{{ request.user.get_role_display }}</small>
            </div>

            <div class="profile-icon">
                <i class="fa-solid fa-user"></i>
            </div>

        </div>

    </div>

</div>
