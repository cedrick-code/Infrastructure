<style>
    .navbar {
        height: 70px;
        background: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 35px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .navbar-left h2 {
        color: #0A2E5C;
        font-size: 22px;
        font-weight: 700;
    }

    .navbar-right {
        display: flex;
        align-items: center;
        gap: 25px;
    }

    .profile {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        padding: 6px;
        border-radius: 10px;
        transition: background-color 0.2s;
    }

    .profile:hover {
        background: #F4F6F9;
    }

    .profile-info {
        text-align: right;
    }

    .profile-info h4 {
        font-size: 15px;
        color: #111827;
        font-weight: 600;
    }

    .profile-info small {
        color: #6B7280;
        font-size: 13px;
    }

    .profile-icon {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: #0A2E5C;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        flex-shrink: 0;
    }
</style>

<div class="navbar-right">

    <div class="profile">

        <div class="profile-info">
            <h4>{{ request.user.get_full_name|default:request.user.username }}</h4>
            <small>{{ request.user.get_role_display }}</small>
        </div>

        <div class="profile-icon">
            <i class="fa-solid fa-user"></i>
        </div>

    </div>

</div>
