{% extends "users/master.html" %}

{% block title %}
Screen Report
{% endblock %}

{% block page_title %}
Screen Report
{% endblock %}

{% block style %}
<style>
    .page-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:25px;
    }

    .page-header h2{
        color:#0A2E5C;
    }

    .back-btn{
        text-decoration:none;
        background:#eee;
        color:#333;
        padding:10px 18px;
        border-radius:8px;
        font-weight:bold;
    }

    .back-btn:hover{
        background:#ddd;
    }

    .form-card{
        background:white;
        border-radius:10px;
        box-shadow:0 2px 8px rgba(0,0,0,.08);
        padding:30px;
        max-width:700px;
    }

    .form-group{
        margin-bottom:20px;
    }

    .form-group label{
        display:block;
        font-size:13px;
        font-weight:bold;
        color:#333;
        margin-bottom:6px;
    }

    .form-group select, .form-group textarea{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:6px;
        font-size:14px;
        font-family:inherit;
    }

    .form-group textarea{
        resize:vertical;
        min-height:100px;
    }

    .form-actions{
        margin-top:25px;
        display:flex;
        gap:10px;
    }

    .save-btn{
        border:none;
        cursor:pointer;
        padding:10px 22px;
        border-radius:8px;
        font-size:14px;
        font-weight:bold;
        background:#0A2E5C;
        color:white;
    }

    .save-btn:hover{
        background:#154A8A;
    }

    .cancel-btn{
        text-decoration:none;
        padding:10px 22px;
        border-radius:8px;
        font-size:14px;
        font-weight:bold;
        background:#eee;
        color:#333;
    }
</style>
{% endblock %}

{% block content %}

<div class="page-header">
    <h2>Screen Report #{{ report_id }}</h2>
    <a href="{% url 'pending_reports' %}" class="back-btn">&larr; Back to List</a>
</div>

<div class="form-card">

    <form method="post">

        {% csrf_token %}

        <div class="form-group">
            <label>Screening Result</label>
            <select name="screening_result" required>
                <option value="Validated">Validated</option>
                <option value="Rejected">Rejected</option>
                <option value="Needs More Info">Needs More Information</option>
            </select>
        </div>

        <div class="form-group">
            <label>Screening Remarks</label>
            <textarea name="screening_remarks" placeholder="Notes about this report's completeness, accuracy, or issues..." required></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="save-btn">Submit Screening</button>
            <a href="{% url 'pending_reports' %}" class="cancel-btn">Cancel</a>
        </div>

    </form>

</div>

{% endblock %}
