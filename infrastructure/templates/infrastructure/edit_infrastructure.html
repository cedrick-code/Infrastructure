{% extends "users/master.html" %}

{% block title %}
Edit Infrastructure
{% endblock %}

{% block page_title %}
Edit Infrastructure
{% endblock %}

{% block style %}
<style>
    .form-card{
        background:#fff;
        padding:25px;
        border-radius:10px;
        box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .section-title{
        margin-bottom:15px;
        color:#0A2E5C;
    }

    .form-grid{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:20px;
    }

    .form-group{
        display:flex;
        flex-direction:column;
    }

    .form-group label{
        margin-bottom:6px;
        font-weight:bold;
    }

    .form-group input,
    .form-group select,
    .form-group textarea{
        padding:10px;
        border:1px solid #ccc;
        border-radius:6px;
        font-size:14px;
    }

    .form-group textarea{
        resize:vertical;
        min-height:90px;
    }

    .full-width{
        grid-column:1 / -1;
    }

    .button-group{
        margin-top:25px;
        display:flex;
        justify-content:flex-end;
        gap:10px;
    }

    .cancel-btn{
        padding:10px 20px;
        text-decoration:none;
        background:#6c757d;
        color:white;
        border-radius:6px;
    }

    .save-btn{
        padding:10px 20px;
        border:none;
        background:#0A2E5C;
        color:white;
        border-radius:6px;
        cursor:pointer;
        font-weight:bold;
    }

    .save-btn:hover{
        background:#154A8A;
    }

    @media(max-width:700px){
        .form-grid{
            grid-template-columns:1fr;
        }

        .full-width{
            grid-column:auto;
        }
    }
</style>
{% endblock %}

{% block content %}

<div class="form-card">

    <form method="POST">

        {% csrf_token %}

        <h3 class="section-title">
            Infrastructure Information
        </h3>

        <div class="form-grid">

            <div class="form-group">

                <label>Infrastructure Name</label>

                <input
                    type="text"
                    name="infra_name"
                    value="{{ infrastructure.infra_name }}"
                    required>

            </div>


            <div class="form-group">

                <label>Infrastructure Type</label>

                <select name="infra_type" required>

                    <option value="road"
                        {% if infrastructure.infra_type == "road" %}selected{% endif %}>
                        Road
                    </option>

                    <option value="bridge"
                        {% if infrastructure.infra_type == "bridge" %}selected{% endif %}>
                        Bridge
                    </option>

                    <option value="drainage"
                        {% if infrastructure.infra_type == "drainage" %}selected{% endif %}>
                        Drainage
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Road Classification</label>

                <input
                    type="text"
                    name="road_classification"
                    value="{{ infrastructure.road_classification }}"
                    placeholder="e.g. National Road">

            </div>


            <div class="form-group">

                <label>Status</label>

                <select name="status" required>

                    <option value="active"
                        {% if infrastructure.status == "active" %}selected{% endif %}>
                        Active
                    </option>

                    <option value="maintenance"
                        {% if infrastructure.status == "maintenance" %}selected{% endif %}>
                        Maintenance
                    </option>

                    <option value="closed"
                        {% if infrastructure.status == "closed" %}selected{% endif %}>
                        Closed
                    </option>

                </select>

            </div>

        </div>


        <br>


        <h3 class="section-title">
            Location Information
        </h3>

        <div class="form-grid">

            <div class="form-group">

                <label>Latitude</label>

                <input
                    type="number"
                    name="latitude"
                    step="any"
                    value="{{ infrastructure.latitude }}"
                    required>

            </div>


            <div class="form-group">

                <label>Longitude</label>

                <input
                    type="number"
                    name="longitude"
                    step="any"
                    value="{{ infrastructure.longitude }}"
                    required>

            </div>


            <div class="form-group full-width">

                <label>Location Description</label>

                <textarea
                    name="location_description"
                    placeholder="Describe the location...">{{ infrastructure.location_description }}</textarea>

            </div>

        </div>


        <div class="button-group">

            <a
                href="{% url 'infrastructure_list' %}"
                class="cancel-btn">
                Cancel
            </a>

            <button
                type="submit"
                class="save-btn">
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
